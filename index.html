<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bunny Survivor</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0b0b0f;
        overflow: hidden;
      }
      #app {
        display: grid;
        place-items: center;
        width: 100vw;
        height: 100vh;
      }
      /* Keep the integer-scaled stage crisp. */
      #app canvas {
        image-rendering: pixelated;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
